name: Save soil data

on:
  push:
    paths:
      - greendata/env.js
      - scripts/update_soil.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download SoilGrids topsoil estimates for the listed places
        run: python scripts/update_soil.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add greendata/data/soil.json
          git diff --cached --quiet || git commit -m "Save SoilGrids topsoil data"
          git push
