name: Update El Niño data

on:
  schedule:
    - cron: "17 14 * * 2"   # every Tuesday; NOAA CPC publishes weekly indices on Mondays
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download NOAA CPC indices
        run: python scripts/update_enso.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add greendata/data/enso.json
          git diff --cached --quiet || git commit -m "Update El Niño indices from NOAA CPC"
          git push
