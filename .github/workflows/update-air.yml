name: Update air quality and weather

on:
  schedule:
    - cron: "41 */3 * * *"   # every 3 hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download CAMS air quality and weather for the map cities
        run: python scripts/update_air.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add greendata/data/air.json
          git diff --cached --quiet || git commit -m "Update air quality and weather from Open-Meteo"
          git push
